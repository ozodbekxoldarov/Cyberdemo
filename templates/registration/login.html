{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Kirish{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Saytga kirish</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}

            <div class="d-flex align-items-center mt-3">
                <button type="submit" class="btn btn-primary">Kirish</button>
                <a href="{% url 'password_reset' %}" class="ms-auto text-decoration-none">
                    Parolni unutdingizmi?
                </a>
            </div>
        </form>

        <hr class="mt-4">
        <p class="text-center">
            Hali ro'yxatdan o'tmaganmisiz? <a href="{% url 'signup' %}">Ro'yxatdan o'tish</a>
        </p>
    </div>
</div>
{% endblock %}
